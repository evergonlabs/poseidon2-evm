name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Toolchains are pinned (not `nightly`) so the gas snapshot is
      # reproducible: an unpinned nightly huffc/forge drifts and breaks the
      # gas `diff` on unrelated PRs. The Solidity/Yul gas is fixed by the
      # pinned solc in foundry.toml; the Huff gas tracks the huffc version,
      # hence the explicit huffc pin below.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Huff
        uses: huff-language/huff-toolchain@v3
        with:
          version: 0.3.2

      - name: Check formatting
        run: forge fmt --check

      - name: Check generated files are in sync
        run: |
          npm run generate:yul
          npm run generate:huff
          git diff --exit-code || (echo "Generated files are out of sync. Run 'npm run generate:yul && npm run generate:huff' and commit the changes." && exit 1)

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Check gas snapshots
        run: |
          cp gas-report gas-report.expected
          ./gas-report.sh
          diff gas-report.expected gas-report
        id: gas

      # Always publish the freshly generated report so that, after a
      # deliberate gas change, the new baseline can be downloaded from the run
      # and committed verbatim (no local Linux/Huff needed to re-baseline).
      - name: Upload regenerated gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas-report
